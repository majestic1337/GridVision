# Ingestion GridVision v2.0 Configuration
project_name: "GridVision"
version: "2.0.0"

paths:
  base_dir: "."
  raw_data: "data/raw"
  processed_assets: "data/processed/assets"
  processed_artifacts: "data/processed/artifacts"
  logs: "data/logs"

parser:
  engine: "docling"
  strategy: "auto"  # auto / native / docling / ocr
  version_check: ">=1.0.0"
  ocr_strategy: "auto"  # force / auto / no_ocr
  table_mode: "markdown"
  ocr_engine: "rapidocr"
  ocr_language: "eng"
  ocr_dpi: 200
  synthesis_enabled: true

profiling:
  enabled: true
  min_native_chars: 150
  scanned_raster_coverage_threshold: 0.70
  tiled_slice_count_threshold: 3
  thumbnail_variance_threshold: 1.0

table_processing:
  enabled: true
  detection_mode: "hybrid"
  reinject_headers_on_split: true

chunking:
  base_chunk_size: 1000
  chunk_overlap: 150
  min_paragraph_words: 30
  max_paragraph_chars: 1500
  separators: ["\n\n", "\n- ", "\n* ", "\n", ". ", " "]

quality_gates:
  min_score: 0.3
  min_word_count: 10
  min_ocr_confidence: 0.8
  min_text_density: 0.4

enrichment:
  caption_model: "gemini-2.0-flash"
  timeout: 15
  max_retries: 3

image_embeddings:
  enabled: false
  model: "clip-ViT-B-32"
